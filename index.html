<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1e3a8a">
<title>Nel Sigillo del Dio Vivente</title>
<style>
	* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
	body {
		min-height: 100vh;
		background: linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%);
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		padding: 1.5rem;
	}
	.hub-title {
		color: #f8fafc;
		font-size: 1.4rem;
		font-weight: 700;
		text-align: center;
		margin-bottom: 0.4rem;
	}
	.hub-subtitle {
		color: rgba(248,250,252,0.75);
		font-size: 0.9rem;
		text-align: center;
		margin-bottom: 2.2rem;
	}
	.hub-cards {
		display: flex;
		flex-direction: column;
		gap: 1rem;
		width: 100%;
		max-width: 380px;
	}
	.hub-card {
		display: flex;
		align-items: center;
		gap: 1rem;
		background-color: #ffffff;
		border-radius: 1rem;
		padding: 1.1rem 1.3rem;
		text-decoration: none;
		box-shadow: 0 8px 20px rgba(0,0,0,0.25);
		transition: transform 0.15s;
	}
	.hub-card:active { transform: scale(0.98); }
	.hub-card-icon {
		font-size: 2.1rem;
		width: 3.2rem;
		height: 3.2rem;
		display: flex;
		align-items: center;
		justify-content: center;
		border-radius: 0.75rem;
		background-color: #eef2ff;
		flex-shrink: 0;
	}
	.hub-card-text { flex-grow: 1; }
	.hub-card-title { font-weight: 700; font-size: 1.05rem; color: #1e293b; }
	.hub-card-desc { font-size: 0.82rem; color: #64748b; margin-top: 0.15rem; }
	.hub-card-arrow { color: #1e3a8a; font-size: 1.3rem; flex-shrink: 0; }
	.hub-footer {
		margin-top: 2rem;
		color: rgba(248,250,252,0.5);
		font-size: 0.75rem;
		text-align: center;
	}
</style>
</head>
<body>
	<div class="hub-title">Nel Sigillo del Dio Vivente</div>
	<div class="hub-subtitle">Scegli cosa vuoi aprire</div>

	<div class="hub-cards">
		<a class="hub-card" href="./canti/index.html">
			<div class="hub-card-icon">📖</div>
			<div class="hub-card-text">
				<div class="hub-card-title">Libretto Canti</div>
				<div class="hub-card-desc">Testi dei canti, ricerca, scaletta, preferiti</div>
			</div>
			<div class="hub-card-arrow">→</div>
		</a>

		<a class="hub-card" href="./messaggi/index.html">
			<div class="hub-card-icon">☁️</div>
			<div class="hub-card-text">
				<div class="hub-card-title">Messaggi dal Cielo</div>
				<div class="hub-card-desc">Messaggi, locuzioni e preghiere del gruppo</div>
			</div>
			<div class="hub-card-arrow">→</div>
		</a>
	</div>

	<div class="hub-footer">Le due app sono indipendenti: ricerche, preferiti e impostazioni restano separati.</div>
</body>
</html>
